<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام التداول</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --buy:#26a69a; --sell:#ef5350; --warn:#f0b429; --line:#30363d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, "Segoe UI", Tahoma, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 0 0 auto; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:14px; }
  button { background:#238636; border-color:#238636; cursor:pointer; }
  main { display:grid; grid-template-columns:1fr 360px; gap:12px; padding:12px 16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  #chart { height:560px; background:var(--panel); border-radius:8px; }
  .card { background:var(--panel); border-radius:8px; padding:12px; margin-bottom:12px; }
  .signal { font-size:28px; font-weight:700; text-align:center; padding:8px; border-radius:6px; }
  .BUY { background:rgba(38,166,154,.2); color:var(--buy); }
  .SELL { background:rgba(239,83,80,.2); color:var(--sell); }
  .WAIT { background:rgba(240,180,41,.15); color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 2px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:left; direction:ltr; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); font-size:13px; }
  .pos { color:var(--buy); } .neg { color:var(--sell); }
  ul { padding-right:18px; margin:6px 0; font-size:13px; }
  h3 { margin:4px 0 8px; font-size:15px; }
</style>
</head>
<body>
<header>
  <h1>📈 نظام التداول الاحترافي</h1>
  <input id="symbol" value="BTCUSDT" size="10">
  <select id="interval">
    <option>15m</option><option selected>1h</option><option>4h</option><option>1d</option>
  </select>
  <input id="balance" type="number" placeholder="رأس المال $" style="width:120px">
  <input id="risk" type="number" value="1" step="0.25" style="width:70px" title="المخاطرة %">
  <button onclick="load()">تحليل</button>
  <button onclick="runBacktest()" style="background:#1f6feb;border-color:#1f6feb">اختبار تاريخي</button>
</header>
<main>
  <div id="chart"></div>
  <aside><div id="bt"></div><div id="side"><div class="card muted">جارِ التحميل…</div></div></aside>
</main>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout: { background: { color: '#161b22' }, textColor: '#e6edf3' },
  grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
  timeScale: { timeVisible: true },
});
const series = chart.addCandlestickSeries();
let priceLines = [];
new ResizeObserver(() => chart.applyOptions({ width: document.getElementById('chart').clientWidth })).observe(document.getElementById('chart'));

const STATUS = { in_zone: 'السعر داخل منطقة الدخول — ادخل الآن', waiting: 'ضع أمر حد (Limit) وانتظر وصول السعر', invalidated: 'الإعداد ملغى' };
const SOURCE = { support: 'منطقة دعم', resistance: 'منطقة مقاومة', ema: 'متوسطات EMA20/50', atr: 'مسافة ATR' };

function line(price, color, title, style = 0) {
  priceLines.push(series.createPriceLine({ price, color, title, lineWidth: 2, lineStyle: style, axisLabelVisible: true }));
}

function planTable(p) {
  if (!p) return '';
  const side = p.side === 'long' ? '<span class="pos">شراء (Long)</span>' : '<span class="neg">بيع (Short)</span>';
  let rows = `<tr><td>الاتجاه</td><td>${side}</td></tr>
    <tr><td>منطقة الدخول</td><td>${p.entryZone.low} – ${p.entryZone.high}</td></tr>
    <tr><td>سعر الدخول</td><td>${p.entry}</td></tr>
    <tr><td>وقف الخسارة</td><td class="neg">${p.stopLoss} (${p.riskPct}%)</td></tr>`;
  p.targets.forEach((t, i) => rows += `<tr><td>الهدف ${i + 1}</td><td class="pos">${t.price} (${t.rr}R)</td></tr>`);
  if (p.position) rows += `<tr><td>الكمية</td><td>${p.position.quantity}</td></tr>
    <tr><td>قيمة الصفقة</td><td>$${p.position.notional} (x${p.position.leverageNeeded})</td></tr>
    <tr><td>المخاطرة</td><td>$${p.position.riskAmount}</td></tr>`;
  return `<table>${rows}</table><p class="muted">${SOURCE[p.source]} · ${STATUS[p.status]}</p>`;
}

async function load() {
  const q = new URLSearchParams({ symbol: symbol.value.trim().toUpperCase(), interval: interval.value, candles: 1, risk: risk.value });
  if (balance.value) q.set('balance', balance.value);
  const side = document.getElementById('side');
  side.innerHTML = '<div class="card muted">جارِ التحليل…</div>';
  const res = await fetch('/analyze?' + q);
  const d = await res.json();
  if (d.error) { side.innerHTML = `<div class="card neg">${d.error}</div>`; return; }

  series.setData(d.candles.map(c => ({ time: c.openTime / 1000, open: c.open, high: c.high, low: c.low, close: c.close })));
  priceLines.forEach(l => series.removePriceLine(l)); priceLines = [];
  d.zones.support.slice(0, 3).forEach(z => line(z.mid, 'rgba(38,166,154,.45)', 'دعم', 2));
  d.zones.resistance.slice(0, 3).forEach(z => line(z.mid, 'rgba(239,83,80,.45)', 'مقاومة', 2));

  const shown = d.plan || (d.score < 0 ? d.short : d.long);
  line(shown.entryZone.high, '#58a6ff', 'دخول', 1);
  line(shown.entryZone.low, '#58a6ff', 'دخول', 1);
  line(shown.stopLoss, '#ef5350', 'وقف');
  shown.targets.forEach((t, i) => line(t.price, '#26a69a', 'TP' + (i + 1)));

  const label = { BUY: 'شراء ▲', SELL: 'بيع ▼', WAIT: 'انتظار ⏸' }[d.signal];
  side.innerHTML = `
    <div class="card"><div class="signal ${d.signal}">${label}</div>
      <p class="muted" style="text-align:center">السعر ${d.price} · القوة ${d.score} / 100 · ATR ${d.indicators.atr}</p></div>
    <div class="card"><h3>${d.plan ? 'خطة الصفقة' : 'السيناريو المحتمل (لا تدخل بعد)'}</h3>${planTable(shown)}</div>
    <div class="card"><h3>أسباب الإشارة</h3><ul>${d.reasons.map(r => `<li class="${r.points > 0 ? 'pos' : 'neg'}">${r.points > 0 ? '+' : ''}${r.points} ${r.text}</li>`).join('')}</ul></div>
    <div class="card"><h3>قواعد الخروج</h3><ul>${d.exitRules.map(r => `<li>${r}</li>`).join('')}</ul></div>
    <p class="muted">⚠️ أداة تحليل فقط وليست نصيحة مالية.</p>`;
}
async function runBacktest() {
  const bt = document.getElementById('bt');
  bt.innerHTML = '<div class="card muted">جارِ الاختبار على آخر 1000 شمعة… قد يستغرق دقيقة</div>';
  const q = new URLSearchParams({ symbol: symbol.value.trim().toUpperCase(), interval: interval.value, limit: 1000 });
  const d = await (await fetch('/backtest?' + q)).json();
  if (d.error) { bt.innerHTML = `<div class="card neg">${d.error}</div>`; return; }
  const s = d.stats;
  if (!s.trades) { bt.innerHTML = '<div class="card muted">لا توجد صفقات مغلقة كافية في هذه الفترة</div>'; return; }
  const pf = s.profitFactor === null ? '∞' : s.profitFactor;
  let verdict, cls;
  if (s.trades < 20) { verdict = 'عدد الصفقات قليل، النتيجة غير موثوقة بعد'; cls = 'WAIT'; }
  else if (s.profitFactor === null || s.profitFactor >= 1.3) { verdict = 'الاستراتيجية مربحة تاريخياً على هذا الفريم'; cls = 'BUY'; }
  else if (s.profitFactor >= 1) { verdict = 'ربح ضعيف، استخدمها بحذر'; cls = 'WAIT'; }
  else { verdict = 'خاسرة تاريخياً على هذا الفريم، لا تستخدمها هنا'; cls = 'SELL'; }
  bt.innerHTML = `<div class="card"><h3>نتيجة الاختبار التاريخي (${d.symbol} · ${d.interval})</h3>
    <table>
      <tr><td>عدد الصفقات</td><td>${s.trades}</td></tr>
      <tr><td>نسبة الربح</td><td>${s.winRate}%</td></tr>
      <tr><td>Profit Factor</td><td class="${pf === '∞' || pf >= 1 ? 'pos' : 'neg'}">${pf}</td></tr>
      <tr><td>مجموع الربح</td><td class="${s.totalR >= 0 ? 'pos' : 'neg'}">${s.totalR}R</td></tr>
      <tr><td>أسوأ تراجع</td><td class="neg">${s.maxDrawdownR}R</td></tr>
    </table>
    <div class="signal ${cls}" style="font-size:15px;margin-top:10px">${verdict}</div></div>`;
}
load();
</script>
</body>
</html>
